<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" role="img" aria-labelledby="title desc">
  <title id="title">温度计 Agent</title>
  <desc id="desc">拟人化温度计形象，蓝白红渐变，有眼睛和微笑。</desc>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="42%" stop-color="#60a5fa"/>
      <stop offset="72%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-30%" width="180%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="20" y="18" width="140" height="200" rx="42" fill="#ffffff" opacity="0.92"/>

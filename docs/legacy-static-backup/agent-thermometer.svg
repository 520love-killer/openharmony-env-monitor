    <circle cx="90" cy="190" r="28" fill="#ef4444"/>
    <path d="M73 42h-15M73 66h-10M73 90h-15M73 114h-10M73 138h-15" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <circle cx="78" cy="83" r="6" fill="#0f172a"/>
    <circle cx="102" cy="83" r="6" fill="#0f172a"/>
    <circle cx="80" cy="81" r="2" fill="#ffffff"/>
    <circle cx="104" cy="81" r="2" fill="#ffffff"/>
    <path d="M78 102c7 8 17 8 24 0" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <path d="M111 126l14-12 10 8-18 16z" fill="#60a5fa" opacity="0.88"/>
    <path d="M69 126l-14-12-10 8 18 16z" fill="#60a5fa" opacity="0.88"/>
    <circle cx="75" cy="176" r="4" fill="#ffffff" opacity="0.7"/>

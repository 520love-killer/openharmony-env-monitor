server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: openharmony-env-monitor-platform
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/openharmony_env_monitor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  sql:
    init:
      mode: never

app:
  retention:
    raw-days: ${RAW_RETENTION_DAYS:30}
    summary-days: ${SUMMARY_RETENTION_DAYS:180}
    anomaly-days: ${ANOMALY_RETENTION_DAYS:180}
  analytics:
    summary-cron: "0 */1 * * * ?"
    anomaly-cron: "30 */1 * * * ?"
    cleanup-cron: "0 0 3 * * ?"
  cache:
    provider: ${CACHE_PROVIDER:caffeine}
    ttl-seconds: ${CACHE_TTL_SECONDS:30}
    max-size: ${CACHE_MAX_SIZE:1000}
  serial:
    enabled: ${SERIAL_ENABLED:false}
    port-name: ${SERIAL_PORT:COM21}
    baud-rate: ${SERIAL_BAUD_RATE:115200}
    reconnect-delay-ms: ${SERIAL_RECONNECT_DELAY_MS:3000}

agent:
  mode: ${AGENT_MODE:mock}
  provider: ${AGENT_PROVIDER:deepseek}
  model: ${AGENT_MODEL:deepseek-chat}
  api-key: ${AGENT_API_KEY:}
  base-url: ${AGENT_BASE_URL:https://api.deepseek.com}

# DeepSeek API 配置（通过环境变量注入，不写死在代码中）
# DEEPSEEK_API_KEY   - API 密钥（不要在代码/日志中打印）
# DEEPSEEK_BASE_URL  - API 地址，默认 https://api.deepseek.com
# DEEPSEEK_MODEL     - 模型名称，默认 deepseek-chat
